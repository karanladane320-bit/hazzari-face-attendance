<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='haazir-mark.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="brand-box">
            <img class="brand-logo" src="{{ url_for('static', filename='haazir-mark.svg') }}" alt="">
            <div>
                <h1>{{ app_name }}</h1>
                <p>{{ tagline }}</p>
            </div>
        </div>
        <nav class="nav">
            <a href="{{ url_for('index') }}">Dashboard</a>
            <a href="{{ url_for('register_student') }}">Register Student</a>
            <a href="{{ url_for('attendance_page') }}">Attendance</a>
            <a href="{{ url_for('students') }}">Students</a>
            <a href="{{ url_for('records') }}">Records</a>
            <a href="{{ url_for('reports') }}">Reports</a>
        </nav>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-box">
                    {% for message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
